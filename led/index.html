<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>LED Banner · 전광판</title>
<style>
  :root{--bg:#0b0b0d;--panel:#16161a;--line:#2a2a30;--fg:#f2f2f2;--muted:#9a9aa3;--acc:#ffd54a}
  html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
  #editor{max-width:520px;margin:0 auto;padding:16px 16px 40px;box-sizing:border-box}
  h1{font-size:20px;margin:8px 0 2px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  textarea{width:100%;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:22px;min-height:84px;resize:none;outline:none;-webkit-user-select:text;user-select:text}
  .row{display:flex;gap:10px;align-items:center;margin:12px 0}
  .row label{flex:0 0 76px;color:var(--muted);font-size:13px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-sizing:border-box}
  .chip.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:1}
  .seg button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0;font-size:14px}
  .seg button.on{background:#2b2b33;color:#fff}
  .toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .toggle input{accent-color:var(--acc);width:20px;height:20px}
  #go{width:100%;margin-top:14px;padding:18px;border:0;border-radius:16px;background:var(--acc);color:#111;font-size:20px;font-weight:700}
  .presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .preset{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:14px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview{height:80px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);margin-top:6px}
  .preview canvas{width:100%;height:100%;display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
  .card h3{margin:0 0 6px;font-size:15px}
  .card p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.5}
  .btn2{background:#2b2b33;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px}
  .btn2.acc{background:var(--acc);color:#111;border:0;font-weight:700}
  #stage{display:none;position:fixed;inset:0;background:#000}
  #stage canvas{width:100%;height:100%;display:block}
  #hud{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;justify-content:space-between;align-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
  #hud.show{opacity:1;pointer-events:auto}
  #hud button{background:#0009;border:1px solid #fff5;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px}
  #hud .mid{color:#fffb;font-size:14px;text-align:center}
  .tiny{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
  #chain{display:none;position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto}
  #chain .in{max-width:520px;margin:0 auto;padding:18px 16px 40px}
  .step{display:none}.step.on{display:block}
  .big{width:100%;padding:18px;border:0;border-radius:16px;background:var(--acc);color:#111;font-size:20px;font-weight:700;margin-top:14px}
  .big.sec{background:#2b2b33;color:#fff;border:1px solid var(--line)}
  .pick{display:flex;gap:10px;justify-content:center;margin:10px 0;direction:ltr}
  .pick button{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:#2b2b33;color:#fff;font-size:22px;font-weight:700}
  .pick button.on{background:var(--acc);color:#111;border:0}
  .h2{font-size:22px;font-weight:800;margin:6px 0 6px}
  .p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 8px}
  .strip{height:96px;border-radius:10px;background:#000;border:1px solid var(--line);margin:8px 0 2px;overflow:hidden}
  .strip canvas{width:100%;height:100%;display:block}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="editor">
  <h1 id="t_title">LED 전광판</h1>
  <p class="sub" id="t_sub"></p>
  <textarea id="text" maxlength="400" rows="2"></textarea>
  <div class="preview"><canvas id="pv"></canvas></div>
  <div class="row"><label id="t_color"></label><div class="chips" id="fg"></div></div>
  <div class="row"><label id="t_bg"></label><div class="chips" id="bg"></div></div>
  <div class="row"><label id="t_size"></label><input type="range" id="size" min="40" max="100" value="80"></div>
  <div class="row"><label id="t_speed"></label><input type="range" id="speed" min="0" max="100" value="45"></div>
  <div class="row"><label id="t_motion"></label><div class="seg" id="motion"><button data-v="scroll" class="on" id="t_m1"></button><button data-v="still" id="t_m2"></button><button data-v="bounce" id="t_m3"></button></div></div>
  <div class="row">
    <span class="toggle"><input type="checkbox" id="blink"><span id="t_blink"></span></span>
    <span class="toggle"><input type="checkbox" id="glow" checked><span id="t_glow"></span></span>
    <span class="toggle"><input type="checkbox" id="mirror"><span id="t_mirror"></span></span>
  </div>
  <div class="row"><label id="t_saved"></label><div class="presets" id="presets"></div></div>
  <button id="go"></button>
  <button class="big sec" id="open_chain"></button>
  <p class="tiny" id="t_tip"></p>
</div>
<div id="chain"><div class="in">
  <div class="step" id="st1">
    <div class="h2" id="c1_h"></div><p class="p" id="c1_p"></p>
    <div class="strip"><canvas id="demo1"></canvas></div><p class="p" id="c1_demo" style="text-align:center"></p>
    <div class="pick" id="c1_pick"></div>
    <button class="big" id="c1_next"></button>
    <button class="big sec" id="c1_back"></button>
  </div>
  <div class="step" id="st2">
    <div class="h2" id="c2_h"></div><p class="p" id="c2_p"></p>
    <button class="big" id="c2_share"></button>
    <button class="big sec" id="c2_next"></button>
  </div>
  <div class="step" id="st3">
    <div class="h2" id="c3_h"></div><p class="p" id="c3_p"></p>
    <div class="strip"><canvas id="demo3"></canvas></div><p class="p" id="c3_demo" style="text-align:center"></p>
    <div class="pick" id="c3_pick"></div>
    <p class="p" id="c3_p2"></p>
    <button class="big" id="c3_go"></button>
    <button class="big sec" id="c3_back"></button>
  </div>
</div></div>
<div id="stage"><canvas id="cv"></canvas><div id="hud"><button id="back">✕</button><span class="mid" id="hud_mid"></span><span><button id="nudgeL">◀</button> <button id="nudgeR">▶</button> <button id="save">★</button></span></div></div>
<div id="toast"></div>
<script src="i18n.js?v=21"></script>
<script>
'use strict';
const VERSION='2.4';
// 앱 안에서 친구에게 보낼 공개 주소(웹 판) / public web URL used for share links inside the native app
const PUBLIC_BASE='https://shb2217-debug.github.io/apps/led/';
// ===== 언어 / i18n =====
const L=(new URLSearchParams(location.search).get('lang')||navigator.language||'en').slice(0,2);
const I18N=window.LED_I18N;
const T=I18N[L]||I18N.en; document.documentElement.lang=L; if(L==='ar') document.documentElement.dir='rtl';
const $=id=>document.getElementById(id);
[['open_chain','open_chain'],['c1_h','c1_h'],['c1_p','c1_p'],['c1_next','c1_next'],['c1_back','back'],['c2_h','c2_h'],['c2_p','c2_p'],['c2_share','c2_share'],['c2_next','c2_next'],['c3_h','c3_h'],['c3_p','c3_p'],['c3_p2','c3_p2'],['c3_go','c3_go'],['c3_back','back'],['c1_demo','demo'],['c3_demo','demo'],['t_title','title'],['t_sub','sub'],['t_color','color'],['t_bg','bg'],['t_size','size'],['t_speed','speed'],['t_motion','motion'],['t_m1','m1'],['t_m2','m2'],['t_m3','m3'],['t_blink','blink'],['t_glow','glow'],['t_mirror','mirror'],['t_saved','saved'],['go','go'],['t_tip','tip']].forEach(([id,k])=>$(id).textContent=T[k]);
$('text').placeholder=T.ph; document.title=T.title;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.opacity=0,1800); }

// ===== 상태 / state =====
const COLORS=['#ff3b3b','#ff8c1a','#ffd54a','#4cff5a','#2bd4ff','#7a6bff','#ff5bd6','#ffffff'];
const BGS=['#000000','#1a0000','#001a0a','#00101f','#1a1200','#ffffff'];
const S={text:'',fg:'#ffd54a',bg:'#000000',size:80,speed:45,motion:'scroll',blink:false,glow:true,mirror:false,n:1,k:1};
try{ Object.assign(S, JSON.parse(localStorage.getItem('led_last')||'{}')); }catch(e){}
// 링크로 받은 설정 / config from shared link (#c=base64url json)
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
const hash=new URLSearchParams(location.search); if(!hash.get('c')) location.hash.slice(1).split('&').forEach(kv=>{ const [k,v]=kv.split('='); if(k==='c') hash.set('c',v); }); let fromLink=false; // 카톡 등이 #꼬리를 떼므로 ?c= 를 쓴다
if(hash.get('c')){ try{ const c=b64d(hash.get('c')); ['text','fg','bg','size','speed','motion','blink','glow','mirror','n','hw','hh'].forEach(k=>{ if(c[k]!==undefined) S[k]=c[k]; }); S.text=String(S.text||'').slice(0,400); S.size=Math.min(100,Math.max(40,+S.size||80)); S.speed=Math.min(100,Math.max(0,+S.speed||0)); if(!['scroll','still','bounce'].includes(S.motion)) S.motion='scroll'; S.hw=Math.min(4000,Math.max(300,+S.hw||0))||undefined; S.hh=Math.min(4000,Math.max(200,+S.hh||0))||undefined; S.k=Math.min(S.n, Math.max(1, S.k)); fromLink=true; persist(); history.replaceState(null,'',location.pathname); }catch(e){} }
S.n=Math.min(5,Math.max(1,+S.n||1)); S.k=Math.min(S.n,Math.max(1,+S.k||1));
function chips(el,list,key){ el.innerHTML=''; list.forEach(c=>{ const d=document.createElement('div'); d.className='chip'+(S[key]===c?' on':''); d.style.background=c; if(c==='#ffffff') d.style.border='2px solid #888'; d.onclick=()=>{ S[key]=c; chips(el,list,key); persist(); }; el.appendChild(d); }); }
chips($('fg'),COLORS,'fg'); chips($('bg'),BGS,'bg');
$('text').value=S.text; $('size').value=S.size; $('speed').value=S.speed; $('blink').checked=S.blink; $('glow').checked=S.glow; $('mirror').checked=S.mirror;
[...$('motion').children].forEach(b=>{ b.classList.toggle('on',b.dataset.v===S.motion); b.onclick=()=>{ S.motion=b.dataset.v; [...$('motion').children].forEach(x=>x.classList.toggle('on',x===b)); persist(); }; });
['text','size','speed','blink','glow','mirror'].forEach(id=>$(id).addEventListener('input',()=>{ S.text=$('text').value; S.size=+$('size').value; S.speed=+$('speed').value; S.blink=$('blink').checked; S.glow=$('glow').checked; S.mirror=$('mirror').checked; persist(); }));
function persist(){ try{ localStorage.setItem('led_last',JSON.stringify(S)); }catch(e){} }
// ===== 이어 붙이기 안내 화면 / chain wizard =====
function shareUrl(){ const hw=Math.max(innerWidth,innerHeight), hh=Math.min(innerWidth,innerHeight); S.hw=hw; S.hh=hh; persist(); const c={text:S.text,fg:S.fg,bg:S.bg,size:S.size,speed:S.speed,motion:S.motion,blink:S.blink,glow:S.glow,mirror:S.mirror,n:S.n,hw,hh}; const inApp=location.hostname==='localhost'||location.protocol==='capacitor:'||location.protocol==='file:'; return (inApp? PUBLIC_BASE : location.origin+location.pathname)+'?c='+b64e(c); }
async function doShare(){ const url=shareUrl(); track('share',{n:S.n});
  if(navigator.share){ try{ await navigator.share({title:T.title,text:T.c2_p,url}); return true; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast(T.copied); }catch(e){ prompt('URL',url); } return true; }
function pickRow(el,from,to,cur,onpick){ el.innerHTML=''; for(let i=from;i<=to;i++){ const b=document.createElement('button'); b.textContent=i; b.className=i===cur?'on':''; b.onclick=()=>onpick(i); el.appendChild(b); } }
function step(n){ ['st1','st2','st3'].forEach((id,i)=>$(id).classList.toggle('on',i===n-1)); $('chain').style.display='block'; window.scrollTo(0,0);
  if(n===1){ pickRow($('c1_pick'),2,5,S.n,i=>{ S.n=i; S.k=Math.min(S.k,i); persist(); step(1); }); demo1.set(S.n,0); }
  if(n===3){ pickRow($('c3_pick'),1,S.n,S.k,i=>{ S.k=i; persist(); step(3); }); demo3.set(S.n,S.k); } }
function closeChain(){ $('chain').style.display='none'; }
$('open_chain').onclick=()=>{ if(S.n<2) S.n=2; step(1); };
$('c1_next').onclick=()=>step(2); $('c1_back').onclick=closeChain;
$('c2_share').onclick=doShare; $('c2_next').onclick=()=>step(3);
$('c3_back').onclick=()=>step(2);
$('c3_go').onclick=()=>{ closeChain(); showTogether(); };
// ===== 저장 목록 / presets =====
let presets=[]; try{ presets=JSON.parse(localStorage.getItem('led_presets')||'[]'); }catch(e){}
function drawPresets(){ const el=$('presets'); el.innerHTML=''; if(!presets.length){ el.innerHTML='<span class="tiny">★</span>'; }
  presets.forEach((p,i)=>{ const b=document.createElement('button'); b.className='preset'; let t; b.textContent=(p.text||'…').split('\n')[0]; b.style.color=p.fg; b.onclick=()=>{ if(b.gone) return; Object.assign(S,p); persist(); location.reload(); }; b.oncontextmenu=e=>{ e.preventDefault(); if(b.gone) return; b.gone=true; clearTimeout(t); presets.splice(i,1); savePresets(); }; b.ontouchstart=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(b.gone) return; b.gone=true; presets.splice(i,1); savePresets(); },700); }; b.ontouchend=b.ontouchmove=b.ontouchcancel=()=>clearTimeout(t); el.appendChild(b); }); }
function savePresets(){ try{ localStorage.setItem('led_presets',JSON.stringify(presets)); }catch(e){} drawPresets(); }
drawPresets();

// ===== 그리기 / renderer =====
// 순서 재생: 줄마다 한 문구. 흐르기는 한 바퀴 지나면 다음 줄, 고정·튕기기는 3초마다.
// 이어 붙이기: n대가 가로로 붙은 «긴 화면»을 가정하고 내 폰(k번째)은 그 중 한 칸만 그린다. 시작 시각은 10초 단위 시계에 맞춰 모든 폰이 같다.
// ===== 시계 맞춤 / clock sync: 인터넷 시간 서버로 내 폰 시계 오차(ms)를 재고, 수동 ◀ ▶ 로 0.1초씩 보정 =====
let clockOffset=0, nudge=0, clockSrc='';
function sharedNow(){ return Date.now()+clockOffset+nudge; }
function tmo(){ return (AbortSignal&&AbortSignal.timeout)? AbortSignal.timeout(3000) : undefined; }
async function syncClock(){
  const srcs=[['https://worldtimeapi.org/api/ip', j=>Date.parse(j.datetime)], ['https://timeapi.io/api/Time/current/zone?timeZone=UTC', j=>{ const dt=String(j.dateTime), i=dt.indexOf('.'); return Date.parse((i>0? dt.slice(0,i+4) : dt)+'Z'); }]];
  // 5번 물어 가장 빨리 온 응답(왕복 최소)만 채택 → 오차 수십 ms / best-of-5 by round trip
  for(const [url,parse] of srcs){ let best=null; for(let i=0;i<5;i++){ try{ const t0=Date.now(); const r=await fetch(url+(url.includes('?')?'&':'?')+'r='+i,{cache:'no-store',signal:tmo()}); const t1=Date.now(); if(!r.ok) break; const sv=parse(await r.json()); if(!isFinite(sv)) break;
      const rtt=t1-t0, off=sv-(t0+t1)/2; if(!best||rtt<best.rtt) best={rtt,off}; }catch(e){ break; } }
    if(best){ clockOffset=best.off; clockSrc=url.split('/')[2]+' ±'+Math.round(best.rtt/2)+'ms · '+(best.off>=0?'+':'')+Math.round(best.off)+'ms'; return true; } }
  // 마지막 수단: 같은 서버(github.io)의 Date 헤더 초 단위 경계를 잡아 0.2초 안으로 보정 / fallback: second-edge of same-origin Date header
  try{ let prev=null; for(let i=0;i<25;i++){ const t0=Date.now(); const r=await fetch(location.pathname+'?clk='+t0,{cache:'no-store',method:'HEAD',signal:tmo()}); const t1=Date.now(); const d=Date.parse(r.headers.get('date')); if(!isFinite(d)) break;
      if(prev!==null && d!==prev){ clockOffset=d-(t0+t1)/2; clockSrc='edge'; return true; } prev=d; await new Promise(res=>setTimeout(res,80)); } }catch(e){}
  clockSrc=''; return false; }
// 고정 글자 폭(글꼴 무관): 이어 붙이기에서 폰마다 글꼴이 달라 measureText 가 다르면 띠 주기가 달라져 위치가 어긋난다 → 모두 같은 공식으로 폭을 정한다
function cwid(t,fs){ let w=0; for(const ch of t){ const c=ch.codePointAt(0); if(c===32) w+=.3; else if(c===0x200D||(c>=0xFE00&&c<=0xFE0F)||(c>=0x300&&c<=0x36F)||(c>=0x1F3FB&&c<=0x1F3FF)) w+=0; else if(c<128){ w+='WMmw'.includes(ch)?1.0:(ch>='A'&&ch<='Z')?.85:(ch>='0'&&ch<='9')?.66:(ch>='a'&&ch<='z')?.66:'@#%&$'.includes(ch)?.95:.45; } else if(c>=0x1F000) w+=1.3; else w+=1.05; } return w*fs; }
function makeRenderer(canvas, chained){
  const ctx=canvas.getContext('2d'); let W=0,H=0,raf=0, t0=performance.now(), x=null, dir=1, line=0, lineT=0;
  function fit(){ const w=Math.round(canvas.clientWidth*devicePixelRatio), h=Math.round(canvas.clientHeight*devicePixelRatio); if(w!==W||h!==H){ W=canvas.width=w; H=canvas.height=h; } }
  function frame(now){
    fit(); const dt=Math.min(.05,(now-t0)/1000); t0=now;
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=S.bg; ctx.fillRect(0,0,W,H);
    const lines=(S.text||T.ph.split('\n')[0]).split('\n').map(s=>s.trim()).filter(Boolean); if(!lines.length) lines.push('LED');
    const multi = chained && !solo && S.n>1;
    // 좌표계: 이어 붙이기면 dp(CSS px) 단위로 그리고, 글자 크기·속도·폰 한 칸 폭은 «호스트 폰 자»(링크의 hw/hh)를 쓴다 → 모든 폰이 같은 cm/s, 같은 글자 높이
    let cw=W, ch=H, refW=W, refH=H;
    if(multi){ const dpr=devicePixelRatio||1; ctx.setTransform(dpr,0,0,dpr,0,0); cw=W/dpr; ch=H/dpr; refW=S.hw||cw; refH=S.hh||ch; }
    const n=multi? S.n : 1, k=multi? S.k-1 : 0; const VW=refW*n;
    const fs=refH*(S.size/100)*.9; ctx.font=`900 ${fs}px system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif`; ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.direction='ltr';
    const sp=(S.speed/100)*refW*1.4+refW*.05; const gap=Math.max(refW*.3, fs*1.2);
    const scrolling = S.motion==='scroll' || multi;
    const on = !S.blink || (Math.floor(now/400)%2===0);
    if(scrolling){
      const widths=lines.map(t=>multi? cwid(t,fs) : ctx.measureText(t).width); const total=widths.reduce((a,w)=>a+w+gap,0)+VW;
      // 이어 붙이기: 벽시계 그 자체로 위치 계산 → 누가 언제 띄워도 같은 순간엔 같은 그림(동시에 누를 필요 없음)
      const elapsed = chained ? sharedNow()/1000 : (now-(frame.start||(frame.start=now)))/1000;
      const pos = VW - (elapsed*sp)%total;
      if(on){ ctx.save(); if(S.mirror&&!multi){ ctx.translate(cw,0); ctx.scale(-1,1); } ctx.fillStyle=S.fg; if(S.glow){ ctx.shadowColor=S.fg; ctx.shadowBlur=fs*.25; }

      if(S.motion==='bounce'){ if(x===null) x=Math.max(0,(cw-tw)/2); if(tw<cw){ x+=dir*sp*dt*.5; if(x<=0){x=0;dir=1;} if(x+tw>=cw){x=cw-tw;dir=-1;} } dx=x; } else dx=(cw-tw)/2;
